<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #000000;
    --paper: #ffffff;
    --card: #ffffff;
    --ember: #36C1B3;
    --ember-soft: #e0f7f4;
    --gold: #4A67A1;
    --line: #d6e4e2;
    --muted: rgba(0,0,0,0.55);
    --done-bg: #eef8f7;
    --select: #4A67A1;
    --select-soft: #e5eaf3;
    --p1: #c0392b;
    --p2: #d9730d;
    --p3: #c9a227;
    --p4: #3f8f5f;
    --p5: #4472a8;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { min-height: 100vh; }

  #app-root {
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 20px 90px;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }

  .brand-logo { margin-bottom: 14px; }
  .brand-logo img { height: 34px; width: auto; display: block; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .header h1 { font-size: 28px; font-weight: 400; letter-spacing: 0.2px; margin: 0; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .header .count { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 13px; color: var(--muted); }

  .pill-btn {
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-size: 12.5px;
    border: none;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .select-toggle { color: var(--select); background: var(--select-soft); }
  .settings-toggle { color: var(--ink); background: var(--line); }
  .alerts-toggle { color: var(--ink); background: var(--line); }
  .alerts-toggle.paused { color: white; background: var(--ember); }

  .subtitle { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 13px; color: var(--muted); margin: 0 0 16px; }

  .sync-status {
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    margin: -6px 0 18px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .sync-dot.on { background: var(--select); }
  .sync-dot.err { background: var(--ember); }

  .settings-panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 22px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .settings-panel h2 { font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; margin: 0 0 8px; font-weight: 400; }
  .settings-panel p { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 0 10px; }
  .settings-panel label { font-size: 12px; color: var(--ink); display: block; margin-bottom: 4px; font-weight: 600; }
  .settings-panel input[type="text"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    font-size: 13px; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; margin-bottom: 12px; background: var(--paper); color: var(--ink);
  }
  .settings-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .settings-btn {
    background: var(--ember); color: white; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .settings-btn.secondary { background: var(--line); color: var(--ink); }
  .settings-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .add-form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 26px; }
  .add-form input[type="text"] {
    width: 100%; border: none; outline: none; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: var(--ink);
    background: transparent; padding: 4px 2px 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
  }
  .add-form input[type="text"]::placeholder { color: #b7ae9f; }
  .add-row { display: flex; gap: 10px; align-items: center; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  .add-row input[type="datetime-local"] {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    color: var(--ink); background: var(--paper); font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .add-btn {
    background: var(--ember); color: white; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; white-space: nowrap;
  }
  .add-btn:active { background: #2ea89c; }

  .add-trigger-btn {
    width: 100%;
    background: var(--ember);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    margin-bottom: 26px;
  }
  .add-trigger-btn:active { background: #2ea89c; }

  .section-label { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 12px; color: var(--muted); margin: 22px 0 10px 4px; }
  .reminder-list { display: flex; flex-direction: column; gap: 8px; }
  .reminder {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .reminder.done { background: var(--done-bg); }
  .reminder.picked { border-color: var(--select); background: var(--select-soft); }

  .check, .pick-box {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; transition: all 0.15s ease;
  }
  .pick-box { border-radius: 6px; }
  .check.checked { background: var(--ember); border-color: var(--ember); color: white; }
  .pick-box.checked { background: var(--select); border-color: var(--select); color: white; }
  .check svg, .pick-box svg { width: 13px; height: 13px; }

  .reminder-body { flex: 1; min-width: 0; }
  .reminder-title { font-size: 15.5px; color: var(--ink); margin: 0; line-height: 1.3; }
  .reminder.done .reminder-title { color: var(--muted); text-decoration: line-through; }
  .reminder-time { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 11.5px; color: var(--gold); margin-top: 2px; }
  .reminder.done .reminder-time { color: var(--muted); }

  .priority-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .priority-label { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 13px; color: var(--muted); margin-right: 4px; }
  .priority-dot { width: 27px; height: 27px; border-radius: 50%; border: 2px solid currentColor; cursor: pointer; padding: 0; position: relative; transition: box-shadow 0.12s ease; }
  .priority-dot::before {
    content: attr(data-p); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 12px; font-weight: 700; color: currentColor; z-index: 1;
  }

  .p1 .reminder-title { color: var(--p1); }
  .p2 .reminder-title { color: var(--p2); }
  .p3 .reminder-title { color: var(--p3); }
  .p4 .reminder-title { color: var(--p4); }
  .p5 .reminder-title { color: var(--p5); }
  .reminder.done.p1 .reminder-title, .reminder.done.p2 .reminder-title, .reminder.done.p3 .reminder-title,
  .reminder.done.p4 .reminder-title, .reminder.done.p5 .reminder-title { color: var(--muted); }

  .not-due-tag { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 10px; color: var(--muted); }

  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .search-bar input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search-clear {
    background: var(--line);
    border: none;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }

  .priority-filter {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .priority-filter-label { font-size: 11.5px; color: var(--muted); margin-right: 2px; }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .sort-label { font-size: 11.5px; color: var(--muted); margin-right: 2px; }
  .sort-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .sort-chip.active { background: var(--ink); color: white; border-color: var(--ink); }

  .edit-btn {
    flex-shrink: 0;
    background: var(--done-bg);
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-size: 11.5px;
    cursor: pointer;
    padding: 6px 10px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-weight: 600;
  }

  .edit-title-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
    background: var(--paper);
  }
  .edit-time-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--paper);
    margin-bottom: 8px;
  }
  .edit-actions { display: flex; gap: 8px; }
  .edit-save-btn, .edit-cancel-btn {
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .edit-save-btn { background: var(--ember); color: white; }
  .edit-cancel-btn { background: var(--line); color: var(--ink); }
  .priority-filter-chip {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid currentColor;
    cursor: pointer; position: relative; padding: 0;
  }
  .priority-filter-chip::before {
    content: attr(data-p); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: currentColor;
  }

  .alarm-priority {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--done-bg);
    border-radius: 20px;
    padding: 4px 12px 4px 4px;
    margin: 0 0 14px;
    font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    font-size: 12px;
    color: var(--ink);
  }
  .alarm-priority-dot {
    width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: white; font-size: 10.5px; font-weight: 700;
  }

  .delete-btn {
    flex-shrink: 0; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer;
    padding: 4px 6px; line-height: 1; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 13.5px; }
  .empty-state .glyph { font-size: 30px; margin-bottom: 10px; opacity: 0.5; }

  .bulk-bar {
    position: sticky; bottom: 0; left: 0; right: 0; background: var(--ink); color: white; border-radius: 14px;
    padding: 12px 14px; margin-top: 16px; display: flex; flex-direction: column; gap: 10px; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  }
  .bulk-row1 { display: flex; align-items: center; justify-content: space-between; }
  .bulk-count { font-size: 13.5px; font-weight: 600; }
  .bulk-cancel { background: none; border: none; color: #cfc8bb; font-size: 13px; cursor: pointer; }
  .bulk-row2 { display: flex; gap: 8px; }
  .bulk-row2 input[type="datetime-local"] { flex: 1; border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  .bulk-apply { background: var(--ember); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .bulk-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .bulk-chip { background: rgba(255,255,255,0.12); border: none; color: #f1ede4; font-size: 12px; padding: 6px 10px; border-radius: 20px; cursor: pointer; }
  .bulk-delete { background: rgba(196,80,45,0.25); border: none; color: #ffb59e; font-size: 12px; padding: 6px 10px; border-radius: 20px; cursor: pointer; }

  .alarm-overlay { position: fixed; inset: 0; background: rgba(28,26,23,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .alarm-card { background: var(--card); border-radius: 18px; padding: 26px 22px 20px; width: 100%; max-width: 380px; text-align: center; }
  .alarm-glyph { width: 52px; height: 52px; border-radius: 50%; background: var(--ember-soft); color: var(--ember); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 24px; }
  .alarm-title { font-size: 19px; margin: 0 0 4px; }
  .alarm-time { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 12.5px; color: var(--muted); margin: 0 0 20px; }
  .alarm-actions { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .alarm-done-btn { background: var(--ink); color: white; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; flex: 1; }
  .alarm-dismiss-btn { background: var(--done-bg); color: var(--ink); border: none; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; cursor: pointer; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  .snooze-label { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 11.5px; color: var(--muted); margin: 4px 0 8px; }
  .snooze-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .snooze-btn { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; font-size: 12px; color: var(--ink); cursor: pointer; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; }
  .snooze-btn.active { background: var(--ember); color: #ffffff; border-color: var(--ember); }
  .queue-note { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 11px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<div id="app-root"></div>

<script>
(function () {
  /* =========================================================
     LOCAL STORAGE (always the source of truth on this device)
     ========================================================= */
  const LOCAL_KEY = 'reminders_app_data_v1';
  const CLIENT_ID_KEY = 'reminders_app_gdrive_client_id';
  const DRIVE_FILE_NAME = 'reminders-app-data.json';

  let reminders = [];
  let loaded = false;
  let selectMode = false;
  let selectedIds = new Set();
  let alarmQueue = [];
  let alertsPaused = false;
  let audioCtx = null;
  let showSettings = false;
  let searchQuery = '';
  let priorityFilter = null;
  let dateFilterMode = 'all'; // 'all' | 'today'
  let showDeleteConfirm = false;
  let pendingDeleteIds = new Set();
  let sortMode = 'due'; // 'due' | 'priority'
  let editingId = null;
  let liveEditTitle = null;
  let liveEditTime = null;
  let showAddPopup = false;
  let addPriority = 1;
  let addAnchorTime = null;
  let editAnchorTime = null;

  // Google Drive sync state
  let clientId = localStorage.getItem(CLIENT_ID_KEY) || '';
  let accessToken = null;
  let tokenClient = null;
  let driveFileId = null;
  let driveStatus = 'idle'; // idle | connecting | syncing | synced | error | not-configured
  let driveError = '';

  const root = document.getElementById('app-root');

  /* ---------------- helpers ---------------- */
  function checkIcon() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function nowLocalInputValue(offsetMs) {
    const d = new Date(Date.now() + (offsetMs || 0));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function isoToLocalInputValue(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function nextOccurrenceISO(hour24) {
    const now = new Date();
    const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour24, 0, 0, 0);
    if (candidate.getTime() <= now.getTime()) candidate.setDate(candidate.getDate() + 1);
    return candidate.toISOString();
  }
  const ABSOLUTE_TIME_OPTIONS = [
    { label: '5 AM', hour: 5 },
    { label: '1 PM', hour: 13 },
    { label: '5 PM', hour: 17 }
  ];
  function absoluteTimeButtonsHtml(dataAttr) {
    return ABSOLUTE_TIME_OPTIONS.map(o => `<button class="snooze-btn" data-${dataAttr}-abs="${o.hour}">${o.label}</button>`).join('');
  }
  function fmtTime(iso) {
    if (!iso) return 'No time set';
    const d = new Date(iso);
    if (isNaN(d)) return 'No time set';
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    const timeStr = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (sameDay) return 'Today, ' + timeStr;
    if (isTomorrow) return 'Tomorrow, ' + timeStr;
    const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return dateStr + ', ' + timeStr;
  }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  // Priority 1-5 rendered using only teal, blue, and black. Every dot starts
  // white/outline; the fill only appears on whichever priority is currently
  // selected for that reminder — the fill itself is the "selected" signal.
  const PRIORITY_META = {
    1: 'var(--ember)',
    2: 'var(--ember)',
    3: 'var(--gold)',
    4: 'var(--gold)',
    5: 'var(--ink)'
  };
  function priorityDotHtml(p, checked, extraAttrs) {
    const color = PRIORITY_META[p];
    const bg = checked ? color : 'transparent';
    const textColor = checked ? '#ffffff' : color;
    return `<button class="priority-dot ${checked ? 'checked' : ''}" style="border-color:${color}; background:${bg}; color:${textColor};" data-p="${p}" ${extraAttrs} title="Priority ${p}"></button>`;
  }
  function priorityFilterChipHtml(p, active) {
    const color = PRIORITY_META[p];
    const bg = active ? color : 'transparent';
    const textColor = active ? '#ffffff' : color;
    return `<button class="priority-filter-chip ${active ? 'active' : ''}" style="border-color:${color}; background:${bg}; color:${textColor};" data-p="${p}" data-filter-priority="${p}" title="Filter to priority ${p}"></button>`;
  }
  function isDue(r) {
    if (!r.when) return false;
    const t = new Date(r.when).getTime();
    return !isNaN(t) && t <= Date.now();
  }

  /* ---------------- local persistence ---------------- */
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(reminders)); }
    catch (e) { console.error('Local save failed', e); }
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) reminders = JSON.parse(raw);
    } catch (e) { reminders = []; }
    loaded = true;
  }

  /* Central save: writes locally immediately, then pushes to Drive if connected */
  let pushTimer = null;
  function save() {
    saveLocal();
    if (accessToken) {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushToDrive, 800);
    }
  }

  /* =========================================================
     GOOGLE DRIVE SYNC
     Uses the 'drive.file' scope: the app can only see/edit files
     it created itself — it cannot browse the rest of your Drive.
     ========================================================= */
  function setDriveStatus(status, err) {
    driveStatus = status;
    driveError = err || '';
    render();
  }

  function ensureTokenClient() {
    if (tokenClient || !clientId) return;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (resp) => {
        if (resp.error) { setDriveStatus('error', resp.error); return; }
        accessToken = resp.access_token;
        setDriveStatus('connecting');
        await syncFromDrive();
      }
    });
  }

  function connectDrive() {
    if (!clientId) { showSettings = true; render(); return; }
    ensureTokenClient();
    if (!tokenClient) {
      setDriveStatus('error', 'Google sign-in script not ready yet — wait a second and try again.');
      return;
    }
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }

  function disconnectDrive() {
    if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(accessToken, () => {});
    }
    accessToken = null;
    driveFileId = null;
    setDriveStatus('idle');
  }

  async function driveFetch(url, options) {
    options = options || {};
    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
    const res = await fetch(url, options);
    if (res.status === 401) {
      accessToken = null;
      throw new Error('Google sign-in expired — reconnect Drive.');
    }
    return res;
  }

  async function findDriveFile() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
    if (!res.ok) throw new Error('Could not search Drive (HTTP ' + res.status + ')');
    const data = await res.json();
    return (data.files && data.files[0]) || null;
  }

  async function createDriveFile(content) {
    const boundary = 'reminders_boundary_xyz';
    const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n` +
      `--${boundary}--`;
    const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if (!res.ok) throw new Error('Could not create Drive file (HTTP ' + res.status + ')');
    const data = await res.json();
    return data.id;
  }

  async function updateDriveFile(fileId, content) {
    const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: content
    });
    if (!res.ok) throw new Error('Could not update Drive file (HTTP ' + res.status + ')');
  }

  async function readDriveFile(fileId) {
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!res.ok) throw new Error('Could not read Drive file (HTTP ' + res.status + ')');
    return res.text();
  }

  // On connect: pull whatever's in Drive (if anything) as the starting point,
  // merging by most-recently-modified reminder id so neither device's data is lost.
  async function syncFromDrive() {
    try {
      setDriveStatus('syncing');
      const file = await findDriveFile();
      if (file) {
        driveFileId = file.id;
        const text = await readDriveFile(file.id);
        const remote = JSON.parse(text || '[]');
        reminders = mergeReminders(reminders, remote);
        saveLocal();
      } else {
        driveFileId = await createDriveFile(JSON.stringify(reminders));
      }
      setDriveStatus('synced');
      render();
    } catch (e) {
      setDriveStatus('error', e.message || String(e));
    }
  }

  async function pushToDrive() {
    if (!accessToken) return;
    try {
      setDriveStatus('syncing');
      if (!driveFileId) {
        const file = await findDriveFile();
        driveFileId = file ? file.id : await createDriveFile(JSON.stringify(reminders));
      }
      await updateDriveFile(driveFileId, JSON.stringify(reminders));
      setDriveStatus('synced');
    } catch (e) {
      setDriveStatus('error', e.message || String(e));
    }
  }

  function mergeReminders(local, remote) {
    const byId = new Map();
    local.forEach(r => byId.set(r.id, r));
    remote.forEach(r => {
      const existing = byId.get(r.id);
      const remoteStamp = r.updated || r.created || 0;
      const existingStamp = existing ? (existing.updated || existing.created || 0) : -1;
      if (!existing || remoteStamp >= existingStamp) byId.set(r.id, r);
    });
    return Array.from(byId.values());
  }

  // Silent background pull — keeps this device in sync with changes made
  // elsewhere without the user having to tap "Sync now".
  let pullInFlight = false;
  async function pullFromDrive() {
    if (!accessToken || !driveFileId || pullInFlight) return;
    pullInFlight = true;
    try {
      const text = await readDriveFile(driveFileId);
      const remote = JSON.parse(text || '[]');
      const merged = mergeReminders(reminders, remote);
      if (JSON.stringify(merged) !== JSON.stringify(reminders)) {
        reminders = merged;
        saveLocal();
        render();
      }
      setDriveStatus('synced');
    } catch (e) {
      setDriveStatus('error', e.message || String(e));
    } finally {
      pullInFlight = false;
    }
  }

  /* =========================================================
     REMINDER LOGIC
     ========================================================= */
  function addReminder(title, when, priority) {
    reminders.unshift({
      id: 'r' + Date.now() + Math.random().toString(36).slice(2, 7),
      title: title.trim(),
      when: when || null,
      priority: priority || 1,
      done: false,
      completedAt: null,
      suppressedUntil: null,
      created: Date.now(),
      updated: Date.now()
    });
    save();
    render();
  }
  function openAddPopup() {
    showAddPopup = true;
    addPriority = 1;
    addAnchorTime = new Date().toISOString();
    render();
  }
  function closeAddPopup() {
    showAddPopup = false;
    render();
  }
  function setAddPriority(p) {
    addPriority = p;
    render();
  }
  function markSnoozeSelected(btn) {
    const grid = btn.closest('.snooze-grid');
    if (!grid) return;
    grid.querySelectorAll('.snooze-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  // Relative bumps (5m/1h/etc.) always calculate from a fixed anchor time —
  // the moment the popup opened (Add) or the reminder's original due time
  // (Edit) — never from whatever a previous click left in the field. This
  // way clicking around doesn't stack: only the last click counts.
  function setTimeInputAbsolute(inputId, hour) {
    const el = document.getElementById(inputId);
    if (!el) return;
    el.value = isoToLocalInputValue(nextOccurrenceISO(hour));
  }
  function bumpAddTime(minutes) {
    const el = document.getElementById('add-popup-time');
    if (!el) return;
    const base = addAnchorTime ? new Date(addAnchorTime) : new Date();
    el.value = isoToLocalInputValue(new Date(base.getTime() + minutes * 60000).toISOString());
  }
  function bumpAddTimeAbsolute(hour) { setTimeInputAbsolute('add-popup-time', hour); }
  function submitAddPopup() {
    const titleEl = document.getElementById('add-popup-title');
    const timeEl = document.getElementById('add-popup-time');
    const title = titleEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    const when = timeEl.value ? new Date(timeEl.value).toISOString() : null;
    const priority = addPriority;
    showAddPopup = false;
    addReminder(title, when, priority);
  }
  function setPriority(id, priority) {
    const r = reminders.find(r => r.id === id);
    if (r) { r.priority = priority; r.updated = Date.now(); }
    save();
    render();
  }
  function startEdit(id) {
    const r = reminders.find(r => r.id === id);
    editingId = id;
    liveEditTitle = null;
    liveEditTime = null;
    editAnchorTime = (r && r.when) ? r.when : new Date().toISOString();
    render();
  }
  function cancelEdit() {
    editingId = null;
    liveEditTitle = null;
    liveEditTime = null;
    editAnchorTime = null;
    render();
  }
  function saveEdit(id, title, whenValue) {
    const r = reminders.find(r => r.id === id);
    if (r) {
      const trimmed = title.trim();
      if (trimmed) r.title = trimmed;
      r.when = whenValue ? new Date(whenValue).toISOString() : null;
      r.suppressedUntil = null;
      r.updated = Date.now();
    }
    editingId = null;
    liveEditTitle = null;
    liveEditTime = null;
    editAnchorTime = null;
    save();
    render();
  }
  function bumpEditTime(id, minutes) {
    const el = document.getElementById('edit-time-' + id);
    if (!el) return;
    const base = editAnchorTime ? new Date(editAnchorTime) : new Date();
    el.value = isoToLocalInputValue(new Date(base.getTime() + minutes * 60000).toISOString());
  }
  function bumpEditTimeAbsolute(id, hour) { setTimeInputAbsolute('edit-time-' + id, hour); }
  function toggleDone(id) {
    const r = reminders.find(r => r.id === id);
    if (r) {
      r.done = !r.done;
      r.completedAt = r.done ? Date.now() : null;
      r.updated = Date.now();
    }
    save();
    render();
  }
  function removeReminder(id) {
    reminders = reminders.filter(r => r.id !== id);
    save();
    render();
  }
  function togglePick(id) {
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    render();
  }
  function toggleSelectMode() {
    selectMode = !selectMode;
    selectedIds.clear();
    render();
  }
  function applyBulkSnooze(minutes) {
    const target = new Date(Date.now() + minutes * 60000).toISOString();
    reminders.forEach(r => { if (selectedIds.has(r.id)) { r.when = target; r.suppressedUntil = null; r.done = false; r.completedAt = null; r.updated = Date.now(); } });
    save(); selectMode = false; selectedIds.clear(); render();
  }
  function applyBulkSnoozeAbsolute(hour) {
    const target = nextOccurrenceISO(hour);
    reminders.forEach(r => { if (selectedIds.has(r.id)) { r.when = target; r.suppressedUntil = null; r.done = false; r.completedAt = null; r.updated = Date.now(); } });
    save(); selectMode = false; selectedIds.clear(); render();
  }
  function applyBulkTime(iso) {
    if (!iso) return;
    reminders.forEach(r => { if (selectedIds.has(r.id)) { r.when = new Date(iso).toISOString(); r.suppressedUntil = null; r.done = false; r.completedAt = null; r.updated = Date.now(); } });
    save(); selectMode = false; selectedIds.clear(); render();
  }
  function bulkMarkIncomplete() {
    reminders.forEach(r => { if (selectedIds.has(r.id)) { r.done = false; r.completedAt = null; r.updated = Date.now(); } });
    save(); selectMode = false; selectedIds.clear(); render();
  }
  function deleteBulk() {
    pendingDeleteIds = new Set(selectedIds);
    showDeleteConfirm = true;
    render();
  }

  function confirmDelete() {
    reminders = reminders.filter(r => !pendingDeleteIds.has(r.id));
    alarmQueue = alarmQueue.filter(id => !pendingDeleteIds.has(id));
    if (editingId && pendingDeleteIds.has(editingId)) { editingId = null; editAnchorTime = null; liveEditTitle = null; liveEditTime = null; }
    save();
    showDeleteConfirm = false;
    pendingDeleteIds = new Set();
    selectMode = false;
    selectedIds.clear();
    render();
  }

  function cancelDelete() {
    showDeleteConfirm = false;
    pendingDeleteIds = new Set();
    render();
  }
  function deleteFromAlarm() {
    const id = alarmQueue[0];
    if (!id) return;
    pendingDeleteIds = new Set([id]);
    showDeleteConfirm = true;
    render();
  }
  function editFromAlarm() {
    const id = alarmQueue[0];
    if (!id) return;
    const r = reminders.find(r => r.id === id);
    if (r) { r.suppressedUntil = r.when; r.updated = Date.now(); save(); }
    alarmQueue.shift();
    editingId = id;
    liveEditTitle = null;
    liveEditTime = null;
    editAnchorTime = (r && r.when) ? r.when : new Date().toISOString();
    render();
  }
  function deleteFromEdit(id) {
    pendingDeleteIds = new Set([id]);
    showDeleteConfirm = true;
    render();
  }

  function matchesSearch(r) {
    if (!searchQuery.trim()) return true;
    return r.title.toLowerCase().includes(searchQuery.trim().toLowerCase());
  }
  function matchesFilters(r) {
    if (!matchesSearch(r)) return false;
    if (priorityFilter !== null && r.priority !== priorityFilter) return false;
    if (dateFilterMode === 'today' && r.when) {
      const d = new Date(r.when);
      const now = new Date();
      const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      if (!sameDay) return false;
    }
    return true;
  }
  function togglePriorityFilter(p) {
    priorityFilter = (priorityFilter === p) ? null : p;
    render();
  }
  function setDateFilterMode(mode) {
    dateFilterMode = mode;
    render();
  }

  function exportSelectedToExcel() {
    const chosen = reminders.filter(r => selectedIds.has(r.id));
    if (!chosen.length || !window.XLSX) return;
    const rows = chosen.map(r => ({
      Title: r.title,
      Priority: r.priority || 3,
      Due: r.when ? new Date(r.when).toLocaleString() : 'No time set',
      Status: r.done ? 'Completed' : 'Active'
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Reminders');
    XLSX.writeFile(wb, 'reminders-export.xlsx');
  }

  function downloadBackup() {
    const blob = new Blob([JSON.stringify(reminders, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reminders-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function restoreBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const restored = JSON.parse(reader.result);
        if (!Array.isArray(restored)) throw new Error('Not a valid backup file');
        reminders = mergeReminders(reminders, restored);
        save();
        render();
      } catch (e) {
        alert('Could not read that backup file: ' + e.message);
      }
    };
    reader.readAsText(file);
  }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.001;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.4);
    } catch (e) {}
  }

  function notifyOS(r) {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      try { new Notification(r.title, { body: 'Reminder due — priority ' + (r.priority || 3) }); } catch (e) {}
    }
  }

  function checkDue() {
    const now = Date.now();

    // Reopen anything that was marked done *before* its due time arrived —
    // an "early" completion doesn't count once the actual due moment hits.
    let reopened = false;
    reminders.forEach(r => {
      if (!r.done || !r.when || !r.completedAt) return;
      const due = new Date(r.when).getTime();
      if (isNaN(due) || due > now) return;
      if (r.completedAt >= due) return; // completed at/after due time — this is final, leave it
      r.done = false;
      r.completedAt = null;
      r.suppressedUntil = null;
      r.updated = Date.now();
      reopened = true;
    });

    let newlyFired = false;
    let newlyFiredReminders = [];
    reminders.forEach(r => {
      if (r.done || !r.when) return;
      const due = new Date(r.when).getTime();
      if (isNaN(due) || due > now) return;
      if (r.suppressedUntil === r.when) return;
      if (!alarmQueue.includes(r.id)) {
        alarmQueue.push(r.id);
        newlyFired = true;
        newlyFiredReminders.push(r);
      }
    });
    alarmQueue.sort((idA, idB) => {
      const a = reminders.find(r => r.id === idA);
      const b = reminders.find(r => r.id === idB);
      if (!a || !b) return 0;
      return (a.priority - b.priority) || (new Date(a.when) - new Date(b.when));
    });
    if (reopened) save();
    if (newlyFired) {
      beep();
      newlyFiredReminders.forEach(notifyOS);
    }
    render();
  }

  function snoozeCurrent(minutes) {
    const id = alarmQueue[0];
    const r = reminders.find(r => r.id === id);
    if (r) { r.when = new Date(Date.now() + minutes * 60000).toISOString(); r.suppressedUntil = null; r.updated = Date.now(); save(); }
    alarmQueue.shift(); render();
  }
  function snoozeCurrentAbsolute(hour) {
    const id = alarmQueue[0];
    const r = reminders.find(r => r.id === id);
    if (r) { r.when = nextOccurrenceISO(hour); r.suppressedUntil = null; r.updated = Date.now(); save(); }
    alarmQueue.shift(); render();
  }
  function dismissCurrent() {
    const id = alarmQueue[0];
    const r = reminders.find(r => r.id === id);
    if (r) { r.suppressedUntil = r.when; r.updated = Date.now(); save(); }
    alarmQueue.shift(); render();
  }
  function completeCurrent() {
    const id = alarmQueue[0];
    const r = reminders.find(r => r.id === id);
    if (r) { r.done = true; r.completedAt = Date.now(); r.updated = Date.now(); save(); }
    alarmQueue.shift(); render();
  }
  function togglePauseAlerts() {
    alertsPaused = !alertsPaused;
    render();
  }

  function sortList(list) {
    const copy = [...list];
    if (sortMode === 'priority') {
      copy.sort((a, b) => (a.priority - b.priority) || (timeOrInf(a) - timeOrInf(b)));
    } else {
      copy.sort((a, b) => (timeOrInf(a) - timeOrInf(b)) || (a.priority - b.priority));
    }
    return copy;
  }
  function timeOrInf(r) {
    return r.when ? new Date(r.when).getTime() : Infinity;
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render() {
    const titleField = document.getElementById('add-popup-title');
    const wasFocused = document.activeElement === titleField;
    const savedTitleValue = titleField ? titleField.value : '';
    const savedCaret = titleField ? titleField.selectionStart : null;
    const timeField = document.getElementById('add-popup-time');
    const savedTimeValue = timeField ? timeField.value : nowLocalInputValue();

    const searchField = document.getElementById('search-input');
    const searchWasFocused = document.activeElement === searchField;
    const savedSearchCaret = searchField ? searchField.selectionStart : null;

    // Preserve whatever's currently in the edit form (including un-saved
    // clicks like a snooze/absolute-time button) across background re-renders.
    const editTitleField = editingId ? document.getElementById('edit-title-' + editingId) : null;
    const editTitleFocused = document.activeElement === editTitleField;
    const editTitleCaret = editTitleField ? editTitleField.selectionStart : null;
    liveEditTitle = editTitleField ? editTitleField.value : null;
    const editTimeField = editingId ? document.getElementById('edit-time-' + editingId) : null;
    liveEditTime = editTimeField ? editTimeField.value : null;

    const active = sortList(reminders.filter(r => !r.done && matchesFilters(r)));
    const done = sortList(reminders.filter(r => r.done && matchesFilters(r)));

      <div class="header">
        <h1>Reminders</h1>
        <div class="header-right">
          <span class="count">${totalActiveCount} active</span>
          <button class="pill-btn settings-toggle" id="settings-toggle">${showSettings ? 'Close' : 'Sync'}</button>
          <button class="pill-btn alerts-toggle ${alertsPaused ? 'paused' : ''}" id="alerts-toggle" title="${alertsPaused ? 'Alerts paused — tap to resume' : 'Alerts on — tap to pause'}">${alertsPaused ? '\ud83d\udd15 Paused' : '\ud83d\udd14 Alerts'}</button>

      </div>
      <div class="priority-filter">
        <span class="priority-filter-label">Search with priority</span>
        ${[1,2,3,4,5].map(p => priorityFilterChipHtml(p, priorityFilter === p)).join('')}
      </div>
      <div class="sort-row">
        <span class="sort-label">Sort by</span>
        <button class="sort-chip ${sortMode === 'due' ? 'active' : ''}" data-sort="due">Due time</button>
        <button class="sort-chip ${sortMode === 'priority' ? 'active' : ''}" data-sort="priority">Priority</button>
      </div>
      <div class="sort-row">
        <span class="sort-label">Show</span>
        <button class="sort-chip ${dateFilterMode === 'all' ? 'active' : ''}" data-date-filter="all">All</button>

      <button class="add-trigger-btn" id="add-trigger-btn">+ Add reminder</button>` : ''}

      ${selectMode && selectedIds.size > 0 ? renderBulkBar() : ''}
      ${showAddPopup ? renderAddPopup(savedTitleValue, savedTimeValue) : ''}
      ${alarmQueue.length && !alertsPaused && !editingId ? renderAlarm() : ''}

  function renderSyncStatus() {
    let label, cls;
    if (!clientId) { label = 'Drive sync not set up — tap "Sync"'; cls = ''; }
    else if (!accessToken) { label = 'Drive not connected — tap "Sync"'; cls = ''; }
    else if (driveStatus === 'syncing' || driveStatus === 'connecting') { label = 'Syncing with Drive…'; cls = 'on'; }
    else if (driveStatus === 'synced') { label = 'Synced with Google Drive'; cls = 'on'; }
    else if (driveStatus === 'error') { label = 'Drive sync error: ' + escapeHtml(driveError); cls = 'err'; }
    else { label = 'Drive connected'; cls = 'on'; }
    return `<div class="sync-status"><span class="sync-dot ${cls}"></span>${label}</div>`;
  }

  function renderSettings() {
    const originNote = location.protocol === 'file:'
      ? `<p style="color:var(--ember);"><strong>Heads up:</strong> this page is open as a local file (file://). Google sign-in will not work here — host this file on a real address (e.g. GitHub Pages) first, then open it that way on both devices.</p>`
      : `<p>Signed in from: <code>${escapeHtml(location.origin)}</code> — make sure this exact address is listed under "Authorized JavaScript origins" for your OAuth Client ID.</p>`;
    return `
      <div class="settings-panel">
        <h2>Google Drive sync</h2>
        <p>Paste your Google OAuth Client ID below (one-time setup, from Google Cloud Console). This lets the app save your reminders to a private file it creates in your own Drive, and read it back on any device you open this page from.</p>
        ${originNote}
        <label for="client-id-input">OAuth Client ID</label>
        <input type="text" id="client-id-input" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${escapeHtml(clientId)}" />
        <div class="settings-row">
          <button class="settings-btn" id="save-client-id">Save Client ID</button>
          ${accessToken
            ? `<button class="settings-btn secondary" id="disconnect-drive">Disconnect</button><button class="settings-btn secondary" id="sync-now">Sync now</button>`
            : `<button class="settings-btn secondary" id="connect-drive">Connect Google Drive</button>`
          }
        </div>
        <p style="margin-top:16px; border-top:1px solid var(--line); padding-top:14px;"><strong>Local backup</strong> — if you're opening this file directly from disk (not a hosted URL), your browser may not reliably keep data between sessions. Download a backup after adding reminders, and restore it any time.</p>
        <div class="settings-row">
          <button class="settings-btn secondary" id="download-backup">Download backup (.json)</button>
          <button class="settings-btn secondary" id="restore-backup-btn">Restore from backup</button>
          <input type="file" id="restore-backup-input" accept=".json" style="display:none;" />
        </div>
      </div>
    `;
  }

  function renderLists(active, done) {
    if (active.length === 0 && done.length === 0) {
      if (searchQuery.trim()) {
        return `<div class="empty-state"><div class="glyph">&#9684;</div>No reminders match "${escapeHtml(searchQuery)}".</div>`;
      }
      return `<div class="empty-state"><div class="glyph">&#9684;</div>Nothing on your list yet.<br/>Add your first reminder above.</div>`;
    }
    let html = '';
    if (active.length) html += `<div class="reminder-list">${active.map(renderItem).join('')}</div>`;
    if (done.length) {
      html += `<div class="section-label">Completed</div>`;
      html += `<div class="reminder-list">${done.map(renderItem).join('')}</div>`;
    }
    return html;
  }

  function renderItem(r) {
    const picked = selectedIds.has(r.id);
    const priority = r.priority || 3;
    const due = isDue(r);

    if (editingId === r.id) {
      const titleVal = liveEditTitle !== null ? liveEditTitle : r.title;
      const timeVal = liveEditTime !== null ? liveEditTime : isoToLocalInputValue(r.when);
      return `
        <div class="reminder p${priority}">
          <div class="reminder-body" style="width:100%;">
            <input type="text" class="edit-title-input" id="edit-title-${r.id}" value="${escapeHtml(titleVal)}" />
            <input type="datetime-local" class="edit-time-input" id="edit-time-${r.id}" value="${timeVal}" />
            <p class="snooze-label" style="margin:0 0 6px;">Push time forward by</p>
            <div class="snooze-grid">
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="5">5m</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="10">10m</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="15">15m</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="30">30m</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="60">1h</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="120">2h</button>
              <button class="snooze-btn" data-edit-bump="${r.id}" data-minutes="300">5h</button>
              <button class="snooze-btn" data-edit-bump-abs="${r.id}" data-hour="5">5 AM</button>
              <button class="snooze-btn" data-edit-bump-abs="${r.id}" data-hour="13">1 PM</button>
              <button class="snooze-btn" data-edit-bump-abs="${r.id}" data-hour="17">5 PM</button>
            </div>
            <div class="edit-actions" style="margin-top:10px;">
              <button class="edit-save-btn" data-save-edit="${r.id}">Save</button>
              <button class="edit-cancel-btn" data-cancel-edit="${r.id}">Cancel</button>
              <button class="edit-cancel-btn" data-delete-from-edit="${r.id}" style="background:var(--ember-soft); color:var(--ember);">Delete</button>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="reminder p${priority} ${r.done ? 'done' : ''} ${picked ? 'picked' : ''}">
        ${selectMode
          ? `<div class="pick-box ${picked ? 'checked' : ''}" data-pick="${r.id}">${picked ? checkIcon() : ''}</div>`
          : `<div class="check ${r.done ? 'checked' : ''}" data-id="${r.id}">${checkIcon()}</div>`
        }
        <div class="reminder-body">
          <p class="reminder-title">${escapeHtml(r.title)}</p>
          <div class="reminder-time">${fmtTime(r.when)}${(!r.done && r.when && !due) ? ' <span class="not-due-tag">&middot; upcoming</span>' : ''}</div>
          ${!selectMode ? `
          <div class="priority-row">
            <span class="priority-label">Priority</span>
            ${[1,2,3,4,5].map(p => priorityDotHtml(p, priority === p, `data-priority-id="${r.id}"`)).join('')}
          </div>` : ''}
        </div>
        ${!selectMode ? `<button class="edit-btn" data-edit-id="${r.id}">Edit</button>` : ''}
      </div>
    `;
  }

  function renderBulkBar() {
    const tomorrow9 = new Date();
    tomorrow9.setDate(tomorrow9.getDate() + 1);
    tomorrow9.setHours(9, 0, 0, 0);
    const in1h = nowLocalInputValue(60 * 60000);
    return `
      <div class="bulk-bar">
        <div class="bulk-row1"><span class="bulk-count">${selectedIds.size} selected</span><button class="bulk-cancel" id="bulk-cancel">Clear</button></div>
        <p class="snooze-label" style="margin:0;">Snooze all for</p>
        <div class="snooze-grid">
          <button class="snooze-btn" data-bulk-snooze="5">5m</button>
          <button class="snooze-btn" data-bulk-snooze="10">10m</button>
          <button class="snooze-btn" data-bulk-snooze="15">15m</button>
          <button class="snooze-btn" data-bulk-snooze="30">30m</button>
          <button class="snooze-btn" data-bulk-snooze="60">1h</button>
          <button class="snooze-btn" data-bulk-snooze="120">2h</button>
          <button class="snooze-btn" data-bulk-snooze="300">5h</button>
          <button class="snooze-btn" data-bulk-snooze-abs="5">5 AM</button>
          <button class="snooze-btn" data-bulk-snooze-abs="13">1 PM</button>
          <button class="snooze-btn" data-bulk-snooze-abs="17">5 PM</button>
        </div>
        <p class="snooze-label" style="margin:10px 0 0;">Or set an exact time</p>
        <div class="bulk-chips">
          <button class="bulk-chip" data-preset="${in1h}">In 1 hour</button>
          <button class="bulk-chip" data-preset="${nowLocalInputValue(24*60*60000)}">Same time tomorrow</button>
          <button class="bulk-chip" data-preset="${tomorrow9.getFullYear() + '-' + pad(tomorrow9.getMonth()+1) + '-' + pad(tomorrow9.getDate()) + 'T09:00'}">Tomorrow, 9 AM</button>
          <button class="bulk-chip" id="bulk-reopen">Mark not completed</button>
          <button class="bulk-chip" id="bulk-export">Export to Excel</button>
          <button class="bulk-delete" id="bulk-delete">Delete selected</button>
        </div>
        <div class="bulk-row2">
          <input type="datetime-local" id="bulk-time" value="${nowLocalInputValue()}" />
          <button class="bulk-apply" id="bulk-apply">Apply</button>
        </div>
      </div>
    `;
  }

  function renderDeleteConfirm() {
    return `
      <div class="alarm-overlay">
        <div class="alarm-card">
          <div class="alarm-glyph" style="background:var(--ember-soft); color:var(--ember);">&#9888;</div>
          <p class="alarm-title">Delete ${pendingDeleteIds.size} reminder${pendingDeleteIds.size === 1 ? '' : 's'}?</p>
          <p class="alarm-time">This can't be undone.</p>
          <div class="alarm-actions">
            <button class="alarm-done-btn" id="confirm-delete-btn" style="background:var(--ember);">Delete</button>
            <button class="alarm-dismiss-btn" id="cancel-delete-btn">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderAddPopup(titleValue, timeValue) {
    return `
      <div class="alarm-overlay">
        <div class="alarm-card">
          <div class="alarm-glyph">+</div>
          <p class="alarm-title" style="margin-bottom:14px;">New reminder</p>
          <input type="text" class="edit-title-input" id="add-popup-title" placeholder="Remind me to..." value="${escapeHtml(titleValue)}" />
          <input type="datetime-local" class="edit-time-input" id="add-popup-time" value="${timeValue}" />
          <p class="snooze-label" style="margin-top:10px;">Push time forward by</p>
          <div class="snooze-grid">
            <button class="snooze-btn" data-bump="5">5m</button>
            <button class="snooze-btn" data-bump="10">10m</button>
            <button class="snooze-btn" data-bump="15">15m</button>
            <button class="snooze-btn" data-bump="30">30m</button>
            <button class="snooze-btn" data-bump="60">1h</button>
            <button class="snooze-btn" data-bump="120">2h</button>
            <button class="snooze-btn" data-bump="300">5h</button>
            <button class="snooze-btn" data-bump-abs="5">5 AM</button>
            <button class="snooze-btn" data-bump-abs="13">1 PM</button>
            <button class="snooze-btn" data-bump-abs="17">5 PM</button>
          </div>
          <p class="snooze-label">Priority</p>
          <div class="priority-row" style="justify-content:center; margin-top:0;">
            ${[1,2,3,4,5].map(p => priorityDotHtml(p, addPriority === p, `data-add-priority="${p}"`)).join('')}
          </div>
          <div class="alarm-actions" style="margin-top:18px;">
            <button class="alarm-done-btn" id="add-submit-btn">Add reminder</button>
            <button class="alarm-dismiss-btn" id="add-cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderAlarm() {
    const r = reminders.find(r => r.id === alarmQueue[0]);
    if (!r) return '';
    const priority = r.priority || 3;
    return `
      <div class="alarm-overlay">
        <div class="alarm-card">
          <div class="alarm-glyph">&#9200;</div>
          <p class="alarm-title">${escapeHtml(r.title)}</p>
          <p class="alarm-time">Was due ${fmtTime(r.when)}</p>
          <div class="alarm-actions">
            <button class="alarm-done-btn" id="alarm-complete">Mark done</button>
            <button class="alarm-dismiss-btn" id="alarm-dismiss">Dismiss</button>
          </div>
          <div class="alarm-actions" style="margin-bottom:14px;">
            <button class="alarm-dismiss-btn" id="alarm-edit" style="flex:1;">Edit</button>
            <button class="alarm-dismiss-btn" id="alarm-delete" style="flex:1;">Delete</button>
          </div>
          <p class="snooze-label">Priority</p>
          <div class="priority-row" style="justify-content:center; margin-top:0 0 16px;">
            ${[1,2,3,4,5].map(p => priorityDotHtml(p, priority === p, `data-alarm-priority-id="${r.id}"`)).join('')}
          </div>
          <p class="snooze-label">Snooze for</p>
          <div class="snooze-grid">
            <button class="snooze-btn" data-snooze="5">5m</button>
            <button class="snooze-btn" data-snooze="10">10m</button>
            <button class="snooze-btn" data-snooze="15">15m</button>
            <button class="snooze-btn" data-snooze="30">30m</button>
            <button class="snooze-btn" data-snooze="60">1h</button>
            <button class="snooze-btn" data-snooze="120">2h</button>
            <button class="snooze-btn" data-snooze="300">5h</button>
            <button class="snooze-btn" data-snooze-abs="5">5 AM</button>
            <button class="snooze-btn" data-snooze-abs="13">1 PM</button>
            <button class="snooze-btn" data-snooze-abs="17">5 PM</button>
          </div>
          ${alarmQueue.length > 1 ? `<p class="queue-note">${alarmQueue.length - 1} more waiting</p>` : ''}
          <button class="alarm-dismiss-btn" id="pause-alerts-btn" style="margin-top:14px; width:100%;">Pause all alert popups</button>
        </div>
      </div>
    `;
  }

  function wireEvents() {
    const selectToggle = document.getElementById('select-toggle');
    if (selectToggle) selectToggle.addEventListener('click', toggleSelectMode);

    const settingsToggle = document.getElementById('settings-toggle');
    if (settingsToggle) settingsToggle.addEventListener('click', () => { showSettings = !showSettings; render(); });

    const alertsToggle = document.getElementById('alerts-toggle');
    if (alertsToggle) alertsToggle.addEventListener('click', togglePauseAlerts);
    const pauseAlertsBtn = document.getElementById('pause-alerts-btn');
    if (pauseAlertsBtn) pauseAlertsBtn.addEventListener('click', togglePauseAlerts);

    const addTriggerBtn = document.getElementById('add-trigger-btn');
    if (addTriggerBtn) addTriggerBtn.addEventListener('click', () => {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      openAddPopup();
    });
    const addSubmitBtn = document.getElementById('add-submit-btn');
    if (addSubmitBtn) addSubmitBtn.addEventListener('click', submitAddPopup);
    const addCancelBtn = document.getElementById('add-cancel-btn');
    if (addCancelBtn) addCancelBtn.addEventListener('click', closeAddPopup);
    const addPopupTitle = document.getElementById('add-popup-title');
    if (addPopupTitle) addPopupTitle.addEventListener('keydown', e => { if (e.key === 'Enter') submitAddPopup(); });
    document.querySelectorAll('[data-bump]').forEach(el => el.addEventListener('click', () => { bumpAddTime(parseInt(el.dataset.bump, 10)); markSnoozeSelected(el); }));
    document.querySelectorAll('[data-bump-abs]').forEach(el => el.addEventListener('click', () => { bumpAddTimeAbsolute(parseInt(el.dataset.bumpAbs, 10)); markSnoozeSelected(el); }));
    document.querySelectorAll('[data-add-priority]').forEach(el => el.addEventListener('click', () => setAddPriority(parseInt(el.dataset.addPriority, 10))));

    document.querySelectorAll('.check').forEach(el => el.addEventListener('click', () => toggleDone(el.dataset.id)));
    document.querySelectorAll('[data-pick]').forEach(el => el.addEventListener('click', () => togglePick(el.dataset.pick)));
    document.querySelectorAll('[data-priority-id]').forEach(el => el.addEventListener('click', () => setPriority(el.dataset.priorityId, parseInt(el.dataset.p, 10))));
    document.querySelectorAll('[data-alarm-priority-id]').forEach(el => el.addEventListener('click', () => setPriority(el.dataset.alarmPriorityId, parseInt(el.dataset.p, 10))));
    document.querySelectorAll('[data-edit-id]').forEach(el => el.addEventListener('click', () => startEdit(el.dataset.editId)));
    document.querySelectorAll('[data-edit-bump]').forEach(el => el.addEventListener('click', () => { bumpEditTime(el.dataset.editBump, parseInt(el.dataset.minutes, 10)); markSnoozeSelected(el); }));
    document.querySelectorAll('[data-edit-bump-abs]').forEach(el => el.addEventListener('click', () => { bumpEditTimeAbsolute(el.dataset.editBumpAbs, parseInt(el.dataset.hour, 10)); markSnoozeSelected(el); }));
    document.querySelectorAll('[data-cancel-edit]').forEach(el => el.addEventListener('click', cancelEdit));
    document.querySelectorAll('[data-delete-from-edit]').forEach(el => el.addEventListener('click', () => deleteFromEdit(el.dataset.deleteFromEdit)));
    document.querySelectorAll('[data-save-edit]').forEach(el => el.addEventListener('click', () => {
      const id = el.dataset.saveEdit;
      const titleEl = document.getElementById('edit-title-' + id);
      const timeEl = document.getElementById('edit-time-' + id);
      saveEdit(id, titleEl.value, timeEl.value);
    }));

    const bulkCancel = document.getElementById('bulk-cancel');
    if (bulkCancel) bulkCancel.addEventListener('click', () => { selectedIds.clear(); render(); });
    const bulkDelete = document.getElementById('bulk-delete');
    if (bulkDelete) bulkDelete.addEventListener('click', deleteBulk);
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    if (confirmDeleteBtn) confirmDeleteBtn.addEventListener('click', confirmDelete);
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    if (cancelDeleteBtn) cancelDeleteBtn.addEventListener('click', cancelDelete);
    const bulkReopen = document.getElementById('bulk-reopen');
    if (bulkReopen) bulkReopen.addEventListener('click', bulkMarkIncomplete);
    const bulkExport = document.getElementById('bulk-export');
    if (bulkExport) bulkExport.addEventListener('click', exportSelectedToExcel);
    const bulkApply = document.getElementById('bulk-apply');
    const bulkTime = document.getElementById('bulk-time');
    if (bulkApply) bulkApply.addEventListener('click', () => applyBulkTime(bulkTime.value));
    document.querySelectorAll('.bulk-chip').forEach(el => el.addEventListener('click', () => applyBulkTime(el.dataset.preset)));
    document.querySelectorAll('[data-bulk-snooze]').forEach(el => el.addEventListener('click', () => applyBulkSnooze(parseInt(el.dataset.bulkSnooze, 10))));
    document.querySelectorAll('[data-bulk-snooze-abs]').forEach(el => el.addEventListener('click', () => applyBulkSnoozeAbsolute(parseInt(el.dataset.bulkSnoozeAbs, 10))));

    const alarmComplete = document.getElementById('alarm-complete');
    if (alarmComplete) alarmComplete.addEventListener('click', completeCurrent);
    const alarmDismiss = document.getElementById('alarm-dismiss');
    if (alarmDismiss) alarmDismiss.addEventListener('click', dismissCurrent);
    const alarmDelete = document.getElementById('alarm-delete');
    if (alarmDelete) alarmDelete.addEventListener('click', deleteFromAlarm);
    const alarmEdit = document.getElementById('alarm-edit');
    if (alarmEdit) alarmEdit.addEventListener('click', editFromAlarm);
    document.querySelectorAll('[data-snooze]').forEach(el => el.addEventListener('click', () => snoozeCurrent(parseInt(el.dataset.snooze, 10))));
    document.querySelectorAll('[data-snooze-abs]').forEach(el => el.addEventListener('click', () => snoozeCurrentAbsolute(parseInt(el.dataset.snoozeAbs, 10))));

    const saveClientIdBtn = document.getElementById('save-client-id');
    if (saveClientIdBtn) saveClientIdBtn.addEventListener('click', () => {
      const val = document.getElementById('client-id-input').value.trim();
      clientId = val;
      localStorage.setItem(CLIENT_ID_KEY, val);
      tokenClient = null;
      render();
    });
    const connectBtn = document.getElementById('connect-drive');
    if (connectBtn) connectBtn.addEventListener('click', connectDrive);
    const disconnectBtn = document.getElementById('disconnect-drive');
    if (disconnectBtn) disconnectBtn.addEventListener('click', disconnectDrive);
    const syncNowBtn = document.getElementById('sync-now');
    if (syncNowBtn) syncNowBtn.addEventListener('click', pushToDrive);
    const downloadBackupBtn = document.getElementById('download-backup');
    if (downloadBackupBtn) downloadBackupBtn.addEventListener('click', downloadBackup);
    const restoreBackupBtn = document.getElementById('restore-backup-btn');
    const restoreBackupInput = document.getElementById('restore-backup-input');
    if (restoreBackupBtn && restoreBackupInput) {
      restoreBackupBtn.addEventListener('click', () => restoreBackupInput.click());
      restoreBackupInput.addEventListener('change', () => {
        if (restoreBackupInput.files[0]) restoreBackup(restoreBackupInput.files[0]);
      });
    }

    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', () => { searchQuery = searchInput.value; render(); });
    }
    const searchClear = document.getElementById('search-clear');
    if (searchClear) searchClear.addEventListener('click', () => { searchQuery = ''; render(); });
    document.querySelectorAll('[data-filter-priority]').forEach(el => {
      el.addEventListener('click', () => togglePriorityFilter(parseInt(el.dataset.filterPriority, 10)));
    });
    document.querySelectorAll('[data-sort]').forEach(el => {
      el.addEventListener('click', () => { sortMode = el.dataset.sort; render(); });
    });
    document.querySelectorAll('[data-date-filter]').forEach(el => {
      el.addEventListener('click', () => setDateFilterMode(el.dataset.dateFilter));
    });
  }

  /* =========================================================
     BOOT
     ========================================================= */
  loadLocal();
  render();
  setInterval(checkDue, 10000);
  checkDue();
  setInterval(pullFromDrive, 30000);
})();
</script>
</body>
</html>
